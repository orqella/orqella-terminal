<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>Terminal</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/module.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Terminal tabs"></div>
      <div class="top-actions">
        <button class="icon-button" id="newButton" type="button" aria-label="New local tab" title="New local tab">＋</button>
        <button class="icon-button" id="menuButton" type="button" aria-label="Terminal keys and actions" aria-haspopup="dialog" aria-expanded="false" title="Keys and actions">⋯</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="banner" id="banner" hidden>
        <span id="bannerText">Connection lost</span>
        <button class="button ghost small-button" id="reconnectButton" type="button">Reconnect</button>
      </div>
      <div class="terminal-wrap" id="terminalWrap">
        <div id="terminal" aria-label="Terminal"></div>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-glyph" aria-hidden="true">▮</div>
        <h2>No terminal tabs</h2>
        <p>Open a local shell on this machine.</p>
        <button class="button" id="emptyNew" type="button">New tab</button>
      </div>
      <div class="selection-bar" id="selectionBar" hidden>
        <span class="selection-info" id="selectionInfo">Drag to select</span>
        <div class="selection-actions">
          <button class="button ghost small-button" id="selectionCopy" type="button">Copy</button>
          <button class="button ghost small-button" id="selectionAll" type="button">Select all</button>
          <button class="button ghost small-button" id="selectionDone" type="button">Done</button>
        </div>
      </div>
      <div class="keybar" id="keybar" aria-label="Terminal keys">
        <div class="keys primary" id="keysPrimary"></div>
      </div>
    </main>
  </div>

  <div class="sheet-backdrop" id="menuBackdrop" hidden></div>
  <section class="menu-panel" id="menuPanel" hidden role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow">Terminal</p>
        <h2 id="menuTitle">Keys &amp; actions</h2>
      </div>
      <button class="icon-button" id="menuClose" type="button" aria-label="Close palette">×</button>
    </div>
    <div class="sheet-body">
      <p class="sheet-label">Keys</p>
      <div class="key-palette" id="keyPalette"></div>
      <p class="sheet-label">Actions</p>
      <div class="action-list" id="actionList">
        <button type="button" data-menu="paste"><span>Paste</span><small>From clipboard</small></button>
        <button type="button" data-menu="copy"><span>Copy selection</span><small>Selected terminal text</small></button>
        <button type="button" data-menu="select"><span>Select text</span><small>Long press or drag</small></button>
        <button type="button" data-menu="select-all"><span>Select all</span><small>Whole buffer</small></button>
        <button type="button" data-menu="keyboard"><span>Keyboard</span><small>Show or hide</small></button>
        <button type="button" data-menu="clear"><span>Clear screen</span><small>Keep the shell running</small></button>
        <button type="button" data-menu="font-down"><span>Smaller text</span><small>Decrease font size</small></button>
        <button type="button" data-menu="font-up"><span>Larger text</span><small>Increase font size</small></button>
        <button type="button" data-menu="fit"><span>Fit to screen</span><small>Refit terminal</small></button>
        <button type="button" data-menu="reconnect"><span>Reconnect</span><small>Reattach this tab</small></button>
        <button type="button" data-menu="close" class="danger"><span>Close tab</span><small>End this shell</small></button>
      </div>
    </div>
  </section>

  <div class="sheet-backdrop" id="textSheetBackdrop" hidden></div>
  <section class="menu-panel text-sheet" id="textSheet" hidden role="dialog" aria-modal="true" aria-labelledby="textSheetTitle">
    <div class="sheet-head">
      <div>
        <p class="eyebrow">Terminal</p>
        <h2 id="textSheetTitle">Paste</h2>
      </div>
      <button class="icon-button" id="textSheetClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <textarea id="textSheetInput" rows="6" spellcheck="false" autocomplete="off"></textarea>
      <div class="text-sheet-actions">
        <button class="button ghost" id="textSheetCancel" type="button">Cancel</button>
        <button class="button" id="textSheetOk" type="button">Insert</button>
      </div>
    </div>
  </section>

  <div class="confirm-backdrop" id="closeBackdrop" hidden></div>
  <section class="confirm-dialog" id="closeDialog" hidden role="alertdialog" aria-modal="true" aria-labelledby="closeTitle" aria-describedby="closeText">
    <h2 id="closeTitle">Close tab?</h2>
    <p id="closeText">The shell running in this tab will be ended.</p>
    <div class="confirm-actions">
      <button class="button ghost" id="closeCancel" type="button">Cancel</button>
      <button class="button danger" id="closeConfirm" type="button">Close tab</button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/xterm/addon-web-links.js"></script>
  <script src="vendor/xterm/addon-unicode11.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
